apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: fil-rouge-dev
nameSuffix: -dev

resources:
  - ../../base

labels:
  - includeSelectors: false
    pairs:
      env: dev

replicas:
  - name: notes-api
    count: 1
  - name: notes-web
    count: 1

configMapGenerator:
  - name: notes-config
    behavior: merge          # complète celle de la base
    literals:
      - APP_GREETING=Environnement de DEV
      - APP_COLOR=#2f855a

patches:
  - target:
      kind: Ingress
      name: notes
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: dev.127.0.0.1.nip.io